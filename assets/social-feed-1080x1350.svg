<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Plantilla vertical de LoVasASudar para publicaciones</title>
  <desc id="desc">Tarjeta oscura con la pregunta cuánto se suda esto y un espacio central para añadir una equivalencia.</desc>
  <defs>
    <radialGradient id="bg" cx="12%" cy="4%" r="95%">
      <stop offset="0" stop-color="#302778"/>
      <stop offset=".52" stop-color="#10132f"/>
      <stop offset="1" stop-color="#07081b"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#3be8ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="930" cy="220" r="255" fill="#ff4fd8" opacity=".08"/>
  <circle cx="80" cy="1120" r="300" fill="#3be8ff" opacity=".08"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="100" fill="#3be8ff" font-size="27" font-weight="700" letter-spacing="4">LOVASASUDAR.COM</text>
    <text x="72" y="245" fill="#ffffff" font-size="88" font-weight="900">¿CUÁNTO SE</text>
    <text x="72" y="348" fill="#ff4fd8" font-size="102" font-weight="900">SUDA ESTO?</text>
    <rect x="72" y="430" width="936" height="520" rx="38" fill="#11142f" stroke="#30345f" stroke-width="3"/>
    <text x="540" y="530" fill="#b7b9d8" font-size="25" font-weight="700" text-anchor="middle" letter-spacing="3">AÑADE AQUÍ EL ANTOJO</text>
    <text x="540" y="690" fill="#3be8ff" font-size="112" font-weight="900" text-anchor="middle">≈ XX–XX</text>
    <text x="540" y="760" fill="#ffffff" font-size="42" font-weight="800" text-anchor="middle">MINUTOS DE ACTIVIDAD</text>
    <line x1="180" y1="820" x2="900" y2="820" stroke="url(#accent)" stroke-width="5"/>
    <text x="540" y="875" fill="#b7b9d8" font-size="28" text-anchor="middle">Ración y actividad deben figurar siempre</text>
    <text x="72" y="1055" fill="#ffffff" font-size="40" font-weight="800">APROXIMADO.</text>
    <text x="72" y="1110" fill="#ffffff" font-size="40" font-weight="800">COMPARTIBLE.</text>
    <text x="72" y="1165" fill="#ffffff" font-size="40" font-weight="800">SIN SERMONES.</text>
    <rect x="72" y="1230" width="936" height="2" fill="#30345f"/>
    <text x="72" y="1288" fill="#b7b9d8" font-size="24">Estimación recreativa · Consulta fuente y método en la web</text>
  </g>
